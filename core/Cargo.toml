[package]
name = "rs-nucflag"
version = "0.1.0"
edition = "2021"

[lib]
name = "rs_nucflag"
path = "src/lib.rs"

[[test]]
name = "examples"
path = "test/test_examples.rs"

[dependencies]
cg2cs = { git = "https://github.com/koisland/cg2cs", rev="a483fb3c70518d560622fd9b850d2cd9d400d0ed", version = "0.1.0" }
clap = { version = "4.5.29", features = ["derive"] }
coitrees = "0.4.0"
eyre = "0.6.12"
itertools = "0.14.0"
log = { version = "0.4.25", features = ["serde"] }
noodles = { version = "0.96.0", features = ["bam", "bgzf", "core", "cram", "fasta", "sam"] }
ordered-float = "5.1.0"
# TODO: Remove timezones feature when fixed.
# https://github.com/pola-rs/polars/issues/25148
polars = { version = "0.52.0", features = ["dtype-u8", "lazy", "abs", "rle", "round_series", "rolling_window", "partition_by", "timezones"] }
rayon = "1.10.0"
rs-moddotplot = { git = "https://github.com/logsdon-lab/rs-moddotplot.git", rev = "66841c8d5f228631a16fcaa5841bfd468067a4c6", version = "0.1.0" }
serde = "1.0.217"
suffix = "1.3.0"
toml = "0.8.20"

[dev-dependencies]
pretty_assertions = "1"
